# Integración continua: se ejecuta en cada push y pull request hacia `main`, y
# en cada tag de versión (`vX.Y.Z`) para que ninguna publicación salga sin
# verificarse. No usa secretos ni credenciales; solo compila y comprueba.
#
# Las actions van en `@v7`, no en `@v4`: la v4 corre sobre un runtime de Node 20
# que GitHub ya marca como obsoleto, y de ahí el aviso que salía en cada
# ejecución. La v7 mantiene los mismos inputs (`node-version-file` y `cache`).
name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancela ejecuciones previas de la misma rama o PR para ahorrar minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Typecheck, build, pruebas y documentación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Compilar Worker y SPA
        run: npm run build

      - name: Ejecutar pruebas
        run: npm run test

      - name: Comprobar documentación exigida
        run: npm run docs:check

      # Solo en un tag de versión: el tag debe concordar con package.json y el
      # CHANGELOG debe tener esa versión cerrada, sin nada «[No publicado]».
      - name: Comprobar la publicación
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:check
